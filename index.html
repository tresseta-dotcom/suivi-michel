<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1418">
<title>Suivi en direct</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #0f1418; overflow: hidden; }
  iframe { position: fixed; inset: 0; width: 100%; height: 100%; height: 100dvh; border: 0; display: block; }
  noscript { color: #fff; font: 16px sans-serif; display: block; padding: 24px; }
</style>
</head>
<body>
<iframe id="suivi" title="Suivi en direct" allow="fullscreen"></iframe>
<noscript>Activez JavaScript, ou ouvrez directement la page de suivi.</noscript>
<script>
  // Adresse du déploiement Apps Script (page spectateur v101 ou plus, intégrable).
  var EXEC = "https://script.google.com/macros/s/AKfycbxLuqBi5UZIAgXzve2HtcXX6ndQAnFqvbfqJOQHJRsb-TGWVVCA-9xLuFzIUp2vMiExog/exec";
  // Les paramètres de l'adresse (ex. ?course=...) sont transmis à la page de suivi.
  document.getElementById("suivi").src = EXEC + (location.search || "");
</script>
</body>
</html>
